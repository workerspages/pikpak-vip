name: 构建并推送 Docker 镜像

on:
  push:
    branches:
      - main  # 当你把代码 push 到 main 分支时自动触发
  workflow_dispatch:  # 允许在 Actions 页面手动点击运行

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 允许工作流向 GHCR 写入镜像

    steps:
      - name: 检出代码库
        uses: actions/checkout@v3

      - name: 设置 QEMU (用于跨架构编译)
        uses: docker/setup-qemu-action@v2

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的 Token，无需手动配置

      - name: 将用户名转换为小写 (Docker 镜像规范要求)
        id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 替换你的 GitHub 用户名或使用自动化变量
          tags: ghcr.io/${{ steps.string.outputs.lowercase }}/pikpak-inviter:latest
          # 自动编译 x86 和 ARM 架构，完美兼容各类 NAS
          platforms: linux/amd64,linux/arm64
